    <path d="M 80 60 Q 80 50 90 50 Q 100 50 100 60 Q 100 50 110 50 Q 120 50 120 60 Q 120 80 100 95 Q 80 80 80 60" transform="translate(50, 50)"/>
    <path d="M 80 60 Q 80 50 90 50 Q 100 50 100 60 Q 100 50 110 50 Q 120 50 120 60 Q 120 80 100 95 Q 80 80 80 60" transform="translate(200, 80)"/>
    <path d="M 80 60 Q 80 50 90 50 Q 100 50 100 60 Q 100 50 110 50 Q 120 50 120 60 Q 120 80 100 95 Q 80 80 80 60" transform="translate(320, 50)"/>
  </g>
  
  <!-- 보디가드 & 소녀 실루엣 -->

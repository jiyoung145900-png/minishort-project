  <rect x="100" y="80" width="35" height="60" rx="5" fill="rgba(0,0,0,0.3)"/>
  <circle cx="117.5" cy="70" r="15" fill="rgba(0,0,0,0.3)"/>
  
  <!-- 소녀 (오른쪽) -->

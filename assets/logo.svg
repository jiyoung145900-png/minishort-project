<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 그래디언트 -->
  <defs>
    <linearGradient id="gradientLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 원형 배경 -->
  <circle cx="100" cy="100" r="95" fill="url(#gradientLogo)"/>
  
  <!-- M 텍스트 -->
  <text x="100" y="125" font-size="90" font-weight="900" text-anchor="middle" fill="white" font-family="Arial, sans-serif">M</text>
  
  <!-- 스포트라이트 효과 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>

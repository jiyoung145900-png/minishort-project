<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dramaBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#dramaBg1)"/>
  
  <!-- 감옥 격자 패턴 -->
  <g stroke="rgba(0,0,0,0.2)" stroke-width="8">
    <line x1="80" y1="40" x2="80" y2="260"/>
    <line x1="160" y1="40" x2="160" y2="260"/>
    <line x1="240" y1="40" x2="240" y2="260"/>
    <line x1="320" y1="40" x2="320" y2="260"/>
    <line x1="40" y1="100" x2="360" y2="100"/>
    <line x1="40" y1="160" x2="360" y2="160"/>
    <line x1="40" y1="220" x2="360" y2="220"/>
  </g>
  
  <!-- 캐릭터 (사람) -->
  <circle cx="200" cy="80" r="20" fill="white" opacity="0.7"/>
  <rect x="180" y="110" width="40" height="50" rx="5" fill="white" opacity="0.7"/>
  
  <!-- 제목 -->
  <text x="200" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Double Life Prison</text>
</svg>

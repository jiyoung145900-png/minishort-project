<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dramaBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4dabf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1971c2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 배경 -->
  <rect width="400" height="300" fill="url(#dramaBg3)"/>
  
  <!-- 얼음 스케이트장 (가로줄) -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
  </g>
  
  <!-- 얼음 효과 (반짝임) -->
  <g fill="white" opacity="0.3">
    <circle cx="50" cy="80" r="8"/>
    <circle cx="150" cy="120" r="6"/>
    <circle cx="300" cy="100" r="7"/>
    <circle cx="350" cy="180" r="5"/>
  </g>
  
  <!-- 스케이터 1 (왼쪽) -->
  <g>
    <!-- 머리 -->
    <circle cx="120" cy="70" r="12" fill="rgba(255,255,255,0.7)"/>
    <!-- 몸 -->
    <rect x="110" y="85" width="20" height="40" rx="3" fill="rgba(255,200,0,0.8)"/>
    <!-- 다리 (스케이트 스타일) -->
    <line x1="110" y1="125" x2="90" y2="145" stroke="rgba(0,0,0,0.5)" stroke-width="3"/>
    <line x1="130" y1="125" x2="150" y2="145" stroke="rgba(0,0,0,0.5)" stroke-width="3"/>
  </g>
  
  <!-- 스케이터 2 (오른쪽) -->
  <g>
    <!-- 머리 -->
    <circle cx="280" cy="75" r="12" fill="rgba(255,255,255,0.7)"/>
    <!-- 몸 -->
    <rect x="270" y="90" width="20" height="40" rx="3" fill="rgba(255,150,150,0.8)"/>
    <!-- 다리 (스케이트 스타일) -->
    <line x1="270" y1="130" x2="250" y2="150" stroke="rgba(0,0,0,0.5)" stroke-width="3"/>
    <line x1="290" y1="130" x2="310" y2="150" stroke="rgba(0,0,0,0.5)" stroke-width="3"/>
  </g>
  
  <!-- 하키 스틱 -->
  <line x1="100" y1="130" x2="140" y2="180" stroke="rgba(0,0,0,0.4)" stroke-width="4"/>
  
  <!-- 별 (Top 표시) -->
  <g fill="gold" opacity="0.8">
    <polygon points="200,50 210,75 237,75 215,92 225,117 200,100 175,117 185,92 163,75 190,75"/>
  </g>
  
  <!-- 제목 -->
  <text x="200" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Hockey Captain Drama</text>
</svg>
